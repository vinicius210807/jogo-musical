name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite publicar manualmente pela aba Actions.
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra, a anterior em andamento é cancelada.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Gerar o build
        run: npm run build

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
